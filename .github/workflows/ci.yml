# Непрерывная интеграция: на каждый push и pull request
# проверяем стиль кода, миграции и запускаем тесты на PostgreSQL.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sosedi
          POSTGRES_USER: sosedi
          POSTGRES_PASSWORD: sosedi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sosedi" --health-interval 5s --health-retries 10

    env:
      DATABASE_URL: postgres://sosedi:sosedi@localhost:5432/sosedi
      DJANGO_SECRET_KEY: ci-secret
      DJANGO_DEBUG: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt

      - name: Линтер
        run: ruff check . && ruff format --check .

      - name: Проверка, что миграции не забыты
        run: python manage.py makemigrations --check --dry-run

      - name: Тесты
        run: pytest
