# Локальный запуск «как в проде»: приложение + PostgreSQL.
# Запуск:  docker compose up --build
# Демо-данные:  docker compose exec web python manage.py seed_demo

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sosedi
      POSTGRES_USER: sosedi
      POSTGRES_PASSWORD: sosedi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sosedi"]
      interval: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://sosedi:sosedi@db:5432/sosedi
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
