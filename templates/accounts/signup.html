{% extends "base.html" %}
{% block title %}Регистрация — Соседи{% endblock %}
{% block page_class %}page-narrow{% endblock %}
{% block content %}
<h1>Регистрация</h1>
<form method="post" novalidate>
  {% csrf_token %}
  {{ form.as_div }}
  <button type="submit" class="btn btn-primary">Создать аккаунт</button>
</form>
<p class="muted small">Уже есть аккаунт? <a href="{% url 'accounts:login' %}">Войти</a></p>
{% endblock %}
